# Tuy chon (buoc 4). Can image lab10_server-api trong cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab10-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: lab10-api }
  template:
    metadata:
      labels: { app: lab10-api }
    spec:
      containers:
        - name: api
          image: lab10_server-api:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5000 }]
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
---
apiVersion: v1
kind: Service
metadata:
  name: lab10-api
spec:
  type: NodePort
  selector: { app: lab10-api }
  ports: [{ port: 5000, targetPort: 5000 }]
